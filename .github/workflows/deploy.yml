name: Deploy server and extension

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    uses: monarchic-langs/.github/.github/workflows/manual-command.yml@main
    with:
      node_version: "22"
      pnpm_version: "10"
      git_user_email: kenneth.skovhus@gmail.com
      git_user_name: skovhus
      command: |
        nix shell nixpkgs#shellcheck nixpkgs#shfmt -c bash scripts/release-server.sh
        VSCE_TOKEN="$VSCE_PERSONAL_ACCESS_TOKEN" nix shell nixpkgs#shellcheck nixpkgs#shfmt -c bash scripts/release-client.sh
    secrets:
      VSCE_PERSONAL_ACCESS_TOKEN: ${{ secrets.VSCE_PERSONAL_ACCESS_TOKEN }}
